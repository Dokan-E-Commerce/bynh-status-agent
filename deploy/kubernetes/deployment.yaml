# kubectl create namespace bynh
# kubectl -n bynh create secret generic bynh-status-agent --from-literal=token='bynh_agt_…'
# kubectl -n bynh apply -f deploy/kubernetes/deployment.yaml
#
# One replica per agent token: two agents with the same token would run every
# check twice.
#
# For production, pin the image by digest so a re-pushed tag can't change what
# runs (find it with `docker buildx imagetools inspect` or on the release page),
# and verify its signature first (see README, "Verifying releases"):
#   image: ghcr.io/dokan-e-commerce/bynh-status-agent:1.0.0@sha256:<digest>
#
# The token is mounted as a file rather than an environment variable.
# networkpolicy.yaml next to this file restricts egress for agents that must
# not reach internal networks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bynh-status-agent
  labels:
    app.kubernetes.io/name: bynh-status-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bynh-status-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bynh-status-agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532   # lets the agent read the mounted token (mode 0440)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bynh-status-agent
          image: ghcr.io/dokan-e-commerce/bynh-status-agent:1
          args: ["run"]
          env:
            - name: BYNH_TOKEN_FILE
              value: /run/secrets/bynh/token
            - name: BYNH_LOG_FORMAT
              value: json
            # On-premise agents that check in-cluster or internal hosts:
            # - name: BYNH_ALLOW_PRIVATE
            #   value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: token
              mountPath: /run/secrets/bynh
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: token
          secret:
            secretName: bynh-status-agent
            defaultMode: 0440
