name: Image

# Runs when a release is PUBLISHED (never for drafts). Packages the exact
# binaries attached to the release, after checking their checksums and
# provenance, into the multi-arch image; pushes it with an SBOM and max
# provenance, then signs it with cosign (keyless) and attests it.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dokan-e-commerce/bynh-status-agent

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download and verify the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p bins dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bins \
            --pattern 'bynh-status-agent-*-unknown-linux-musl' --pattern SHA256SUMS
          (cd bins && sha256sum -c SHA256SUMS --ignore-missing)
          for f in bins/bynh-status-agent-*-unknown-linux-musl; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          cp bins/bynh-status-agent-x86_64-unknown-linux-musl dist/bynh-status-agent-amd64
          cp bins/bynh-status-agent-aarch64-unknown-linux-musl dist/bynh-status-agent-arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
